name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff lint
        run: python -m ruff check .
      - name: Run Ruff format check
        run: python -m ruff format --check .

  # ---------------------------------------------------------------------------
  # NIVEL 1 — CORE (stdlib pura): matriz amplia, desde 3.8.
  # Los tests de los ejemplos se excluyen; el gate de cobertura (>=95% sobre
  # spindecoupler + socketcomms, definido en addopts) se mantiene y pasa al 100%.
  # ---------------------------------------------------------------------------
  test-core:
    name: core / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          # macos-latest es arm64 (macOS 14+); setup-python no ofrece 3.8/3.9
          # para arm64, así que esas combinaciones van al runner Intel de abajo.
          - os: macos-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.9'
        include:
          - os: macos-13   # último runner Intel de GitHub
            python-version: '3.8'
          - os: macos-13
            python-version: '3.9'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run core test suite (coverage gate on library modules)
        run: >
          python -m pytest
          --ignore=tests/test_fopcontrol_smoke.py
          --ignore=tests/test_fopcontrol_reward_unit.py
          --ignore=tests/test_lunarlander_smoke.py
          --ignore=tests/test_lunarlander_reward_unit.py
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '--cov-report=html' || '' }}
      - name: Upload coverage artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312-ubuntu
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # NIVEL 2 — EJEMPLOS: solo versiones vivas de Python (3.10-3.13).
  # Justificación: gymnasium >=1.2 exige >=3.10 y box2d 2.3.10 publica wheels
  # binarios cp310-cp313 para los tres SO; en 3.8/3.9 pip caería a
  # box2d-py 2.3.5 (sin wheels), que obliga a compilar con SWIG y es frágil.
  # Sin gate de cobertura: aquí se prueba que los ejemplos funcionan.
  # ---------------------------------------------------------------------------
  test-examples:
    name: examples / ubuntu / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package, test and example dependencies
        run: >
          python -m pip install -e ".[test]"
          -r examples/first_order_plant_control/requirements.txt
          -r examples/lunar_lander/requirements.txt
      - name: Run example test suite (LunarLander smoke no longer skips)
        run: >
          python -m pytest
          tests/test_fopcontrol_smoke.py
          tests/test_fopcontrol_reward_unit.py
          tests/test_lunarlander_smoke.py
          tests/test_lunarlander_reward_unit.py
          --override-ini addopts=""
