name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff lint
        run: python -m ruff check .
      - name: Run Ruff format check
        run: python -m ruff format --check .

  # ---------------------------------------------------------------------------
  # LEVEL 1 — CORE (pure stdlib): broad matrix, starting at Python 3.8.
  # Example tests are excluded; the coverage gate (>=95% for spindecoupler +
  # socketcomms, configured in addopts) remains and reaches 100%.
  # ---------------------------------------------------------------------------
  test-core:
    name: core / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run core test suite (coverage gate on library modules)
        run: >
          python -m pytest
          --ignore=tests/test_fopcontrol_smoke.py
          --ignore=tests/test_fopcontrol_reward_unit.py
          --ignore=tests/test_lunarlander_smoke.py
          --ignore=tests/test_lunarlander_reward_unit.py
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '--cov-report=html' || '' }}
      - name: Upload coverage artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312-ubuntu
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          slug: uncore-team/rl_spin_decoupler
          fail_ci_if_error: true

  # ---------------------------------------------------------------------------
  # LEVEL 2 — EXAMPLES: supported Python versions only (3.10-3.13).
  # Rationale: the gymnasium[box2d] extra provides Box2D wheels for cp310-cp313.
  # On 3.8/3.9, pip may fall back to box2d-py 2.3.5 without wheels, requiring
  # a fragile SWIG build.
  # No coverage gate: this job verifies that the examples run.
  # ---------------------------------------------------------------------------
  test-examples:
    name: examples / ubuntu / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package, test and example dependencies
        run: >
          python -m pip install -e ".[test]"
          -r examples/first_order_plant_control/requirements.txt
          -r examples/lunar_lander/requirements.txt
      - name: Run example test suite (LunarLander smoke no longer skips)
        run: >
          python -m pytest
          tests/test_fopcontrol_smoke.py
          tests/test_fopcontrol_reward_unit.py
          tests/test_lunarlander_smoke.py
          tests/test_lunarlander_reward_unit.py
          --override-ini addopts=""
