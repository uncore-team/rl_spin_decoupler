name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: python -m pytest

      - name: Run test suite with HTML coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: python -m pytest --cov-report=html

      - name: Upload coverage artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py312-ubuntu
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

      # Optional Codecov upload.
      # Enable this after deciding to publish coverage externally.
      # For private repositories, add a CODECOV_TOKEN repository secret and
      # uncomment the step below.
      # - name: Upload coverage to Codecov
      #   if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.xml
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}