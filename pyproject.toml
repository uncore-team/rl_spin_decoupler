[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-spin-decoupler"
version = "1.2.0"
description = "Socket-based decoupling utilities for reinforcement learning and agent spin loops."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Juan-Antonio Fernandez-Madrigal" }
]
keywords = ["reinforcement-learning", "sockets", "agent", "control", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
rl = [
    "stable-baselines3",
    "gymnasium",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6.9",
    "pre-commit>=3.8",
]
docs = [
    "Sphinx>=7.4,<8.0",
    "furo>=2024.8.6",
]

[tool.setuptools]
py-modules = ["spindecoupler"]
packages = ["rl_spin_decoupler", "rl_spin_decoupler.socketcomms"]
include-package-data = false

[tool.setuptools.package-dir]
rl_spin_decoupler = "."
"rl_spin_decoupler.socketcomms" = "socketcomms"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=spindecoupler --cov=rl_spin_decoupler.socketcomms --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__\\s*==\\s*[\"']__main__[\"']:",
]

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = [
    "docs/_build",
    "README.md",
    "skeleton_agent_side.py",
    "skeleton_rl_side.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP032"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true